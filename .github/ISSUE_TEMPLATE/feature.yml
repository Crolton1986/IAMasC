name: Feature request
description: Propose a new capability or connector
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should IAMasC do? Mockups or examples welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lifecycle (joiner / mover / leaver)
        - Application connector
        - HR connector
        - Inventory
        - Web UI
        - API
        - Platform / CI / deployment
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this grant, remove, or expose access? What could go wrong?

name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Don't file it here. Follow SECURITY.md instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IAMasC version
  - type: input
    id: env
    attributes:
      label: OS and PowerShell version
      placeholder: Windows Server 2022, PowerShell 7.4.6

name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  security:
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  publish:
    name: publish
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches CHANGELOG
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
              throw "CHANGELOG.md has no '## [$version]' section."
          }
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./build.ps1 -Task Package -Version $env:TAG.TrimStart('v')
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/IAMasC-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/IAMasC-*.zip
      - name: Release notes from CHANGELOG
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Escape($env:TAG.TrimStart('v'))
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$version\][^\n]*\n(.*?)(?=^## \[|\z)")
          $match.Groups[1].Value.Trim() | Set-Content dist/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "IAMasC $TAG" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            dist/IAMasC-*.zip dist/IAMasC-*.zip.sha256 dist/IAMasC-sbom.spdx.json

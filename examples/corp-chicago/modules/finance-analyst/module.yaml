apiVersion: iamasc.dev/v1
kind: Module
metadata:
  name: finance-analyst
  namespace: corp
  version: 1.2.0
  description: Baseline access for Finance staff across AD, Salesforce, and NetSuite.
spec:
  owner: E-001104                       # approves requests that use the application chain
  inputs:
    costCenter: { type: string, required: true }
  grants:
    activedirectory:
      account: { ou: "OU=Finance,OU=Chicago,OU=Users,DC=corp,DC=example,DC=com" }
      group: [GG-Finance-All, GG-SharePoint-Finance]
      attribute:
        department: Finance
        extensionAttribute1: "{{ inputs.costCenter }}"
    salesforce:
      account: { license: Salesforce }
      profile: Finance User
      permissionSet: [Reports_Viewer]
    netsuite:
      role:
        - { name: Finance Viewer, subsidiary: US }
